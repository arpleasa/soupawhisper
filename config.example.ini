[whisper]
# Model size: tiny.en, base.en, small.en, medium.en, large-v3
# Or a cloud/local backend prefix instead of a faster-whisper model name:
#   groq:whisper-large-v3-turbo       - Groq cloud API
#   voxtral:voxtral-mini-2602         - Mistral cloud API (Voxtral Mini Transcribe 2)
#   voxtral-local:/path/to/model.gguf - local voxtral.cpp GGUF (no network, needs voxtral_binary below)
model = base.en

# Device: cpu or cuda (cuda requires cuDNN)
device = cpu

# Compute type: int8 for CPU, float16 for GPU
compute_type = int8

# Path to the voxtral.cpp CLI binary, only used when model = voxtral-local:...
# Defaults to "voxtral" (looked up on PATH); set a full path if it isn't on PATH.
voxtral_binary = voxtral

[hotkey]
# Key to hold for recording: f12, scroll_lock, pause, etc.
key = f12

[behavior]
# Type text into active input field
auto_type = true

# Copy transcription to clipboard (set false to type only, leaving clipboard untouched)
copy_to_clipboard = true

# Show desktop notification
notifications = true

# Seconds before entering "hold-to-record" mode, otherwise "toggle" mode
long_press = 0.4
